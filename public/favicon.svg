<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" rx="16" fill="#04080F"/>
  <!-- Outer arc (large, over top) -->
  <path d="M 16,72 A 38,38 0 1 0 84,72"
        stroke="white" stroke-width="5.5" fill="none" stroke-linecap="round"/>
  <!-- Inner arc (concentric, cyan) -->
  <path d="M 29,65 A 24,24 0 1 0 71,65"
        stroke="#00D4FF" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Nodes outer arc -->
  <circle cx="16" cy="72" r="6" fill="white"/>
  <circle cx="84" cy="72" r="6" fill="white"/>
  <circle cx="50" cy="16" r="6" fill="white"/>
  <!-- Node inner arc top (cyan) -->
  <circle cx="50" cy="30" r="5" fill="#00D4FF"/>
</svg>
